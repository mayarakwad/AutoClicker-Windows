# Builds AutoClicker.exe and AutoClicker-Setup.exe on a GitHub-hosted Windows
# machine, runs the tests there, checks the built exe starts, and installs and
# uninstalls the installer both for one user and for all users. Download both
# from the run's Artifacts. Pushing a version tag (git tag v1.0.2 && git push
# origin v1.0.2) also publishes them as a public GitHub Release. So does running
# the workflow by hand (Actions > Windows build > Run workflow) with a release
# tag such as v1.0.2: the release and its tag are made on the commit it built.
name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this new tag, e.g. v1.0.2 (must match version_info.txt). Leave empty to only build and test."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # only used by the last step, to publish a release for v* tags
    outputs:
      release_tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements.txt

      - name: Unit tests
        shell: bash
        run: |
          set +e
          .venv/Scripts/python -m unittest -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # As annotations, failures are readable without signing in, unlike the log.
            .venv/Scripts/python .github/annotate_test_failures.py test-output.txt
          fi
          exit "$status"

      - name: Build AutoClicker.exe
        shell: cmd
        run: build.bat

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # The runner image usually has it already; build_installer.bat finds it.
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe") -contains $true
          if (-not $found) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build AutoClicker-Setup.exe
        shell: cmd
        run: build_installer.bat

      - name: Upload the exe and installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Windows
          path: |
            dist/AutoClicker.exe
            dist/AutoClicker-Setup.exe
          if-no-files-found: error

      - name: Check the built exe starts
        shell: pwsh
        run: |
          # Fresh settings folder, so nothing is written to the runner's profile.
          $env:APPDATA = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\appdata").FullName
          $app = Start-Process -FilePath dist\AutoClicker.exe -PassThru
          Start-Sleep -Seconds 15  # the one-file exe unpacks itself first
          if ($app.HasExited) {
            Write-Output "::error title=AutoClicker exited during startup (code $($app.ExitCode))::It closed within 15 seconds of starting."
            exit 1
          }
          taskkill /PID $app.Id /T /F | Out-Null  # /T: the one-file exe runs the app as a child process

      - name: Check the installer installs and uninstalls
        shell: pwsh
        run: .github/test_installer.ps1 -Setup dist\AutoClicker-Setup.exe

      - name: Publish release (v* tags, or a release tag given when run by hand)
        id: publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          # The tag must name the version built into the exe (version_info.txt).
          version=$(powershell -NoProfile -Command "(Get-Item dist/AutoClicker.exe).VersionInfo.ProductVersion" | tr -d '\r')
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Release tag doesn't match the version::$TAG was given, but dist/AutoClicker.exe is version $version (version_info.txt)."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          AutoClicker for Windows 10 and 11. Download with caution: neither file is code-signed.

          **Installer:** download **AutoClicker-Setup.exe** and run it. It lets you install for all users or just for you, choose the folder, and add a desktop shortcut and a taskbar pin. Uninstall it from Settings > Apps.

          **Without installing:** download **AutoClicker.exe** and run it, or download and start it from PowerShell:

          ```
          $ProgressPreference='SilentlyContinue'; $d="$env:LOCALAPPDATA\AutoClicker"; New-Item -ItemType Directory -Force $d | Out-Null; Invoke-WebRequest https://github.com/mayarakwad/AutoClicker-Windows/releases/latest/download/AutoClicker.exe -OutFile "$d\AutoClicker.exe"; Start-Process "$d\AutoClicker.exe"
          ```

          If Windows says "An Application Control policy has blocked this file", Smart App Control is on and blocks unsigned apps; run it from source instead (see the README). A browser download shows a SmartScreen warning the first time: click More info, then Run anyway.
          EOF
          # --target makes the tag on this commit when it doesn't exist yet (runs by hand).
          gh release create "$TAG" dist/AutoClicker-Setup.exe dist/AutoClicker.exe \
            --target "$GITHUB_SHA" --title "AutoClicker $TAG" --notes-file release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Makes, checks and (with a WINGET_TOKEN secret) submits the winget manifests for the new release.
  winget:
    needs: build
    if: needs.build.outputs.release_tag != ''
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ needs.build.outputs.release_tag }}
    secrets: inherit
